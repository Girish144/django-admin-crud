{%extends 'base.html'%}

{%block title%}
display

{%endblock%}
{%block body%}
<table border="2" >
    <h1>Product Details</h1>
    <thead>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Loc</th>
    </tr>
    </thead>

    {% for i in item %}
    <tr>
        <td>{{i.name}}</td>
        <td>{{i.price}}</td>
        <td>{{i.qty}}</td>
        <td>{{i.loc}}</td>
    </tr>
    {%endfor%}
</table>
{%endblock%}
